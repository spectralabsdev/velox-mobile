name: Reportar un error / Report a bug
description: Describe un problema reproducible sin incluir información confidencial.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Este reporte es público. No incluyas tokens, contraseñas, código privado ni registros de clientes. / This report is public. Do not include credentials or confidential data."
  - type: input
    id: version
    attributes:
      label: Versión de la app / App version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Sistema operativo y dispositivo / OS and device
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir / Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Qué ocurrió / Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad / Privacy
      options:
        - label: Revisé el reporte y no contiene información confidencial. / I removed confidential information.
          required: true
